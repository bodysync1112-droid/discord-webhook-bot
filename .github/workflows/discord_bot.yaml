name: 15-Min D2C Promotion Webhook

on:
  schedule:
    # 여기가 핵심입니다: 15분 주기로 계속 무한 반복 실행
    - cron: '*/15 * * * *'
  workflow_dispatch: 

jobs:
  broadcast:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 1. 리포지토리 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 런타임 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. 홍보 스크립트 실행 (환경 변수 은닉)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python webhook_sender.py

